[package]
name = "alem-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"   # encodes &[u8] as MsgPack bin (not integer array)
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
libsql = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
log = "0.4"

# NEW DEPENDENCIES FOR CRDT
automerge = "0.7"
base64 = "0.22"
env_logger = "0.11"

opener = "0.7"
tauri-plugin-deep-link = "2"

# Vault encryption
chacha20poly1305 = "0.10"
rand = "0.8"

# Argon2id key derivation from user password (OWASP recommended)
argon2 = "0.5"

# OS keychain storage (Windows Credential Store / macOS Keychain / Linux Secret Service)
keyring = "3"

# CPU-bound parallelism (parallel file read + encrypt across all cores)
rayon = "1.10"

# Epoch key ECDH (x25519 Diffie-Hellman for server-side key agreement)
x25519-dalek = { version = "2", features = ["static_secrets"] }

# HKDF key derivation from ECDH shared secret → ChaCha20 file key
hkdf = "0.12"
sha2 = "0.10"

# Apache Arrow IPC — columnar in-memory format for client-side analytics
# Captures document metadata with timestamps, partitioned by day/week/month/year.
# Arrow IPC bytes are sent to the server which converts them to Parquet for S3 storage.
arrow = { version = "53", default-features = false, features = ["ipc"] }

# MessagePack — binary XRPC wire format (device ↔ server), ~50% smaller than JSON
rmp-serde = "1.3"

# Image decoding — load JPEG/PNG/WebP/GIF pixels for Arrow frame pipeline
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
