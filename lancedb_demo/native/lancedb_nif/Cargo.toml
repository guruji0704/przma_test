[package]
name = "lancedb_nif"
version = "0.1.0"
edition = "2021"

[lib]
name = "lancedb_nif"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.37"
lancedb = "0.12.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
arrow-array = "52"
arrow-schema = "52"
futures = "0.3"

[dependencies.chrono]
version = "=0.4.38"

[profile.dev]
codegen-units = 1
opt-level = 0
lto = false
panic = "abort"
incremental = false

[workspace]
members = ["native/lancedb_nif"]

[profile.release]
codegen-units = 1
opt-level = 1
lto = false
panic = "abort"