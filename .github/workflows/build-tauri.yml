name: Build Tauri Linux Binary

on:
  push:
    branches: [ latest ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            pkg-config \
            build-essential

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2.10.0

      - name: Install frontend dependencies
        working-directory: alem-desktop
        run: npm install

      - name: Build Tauri app
        working-directory: alem-desktop
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: alem-linux-binary
          path: |
            alem-desktop/src-tauri/target/release/alem-desktop
          retention-days: 7

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: alem-linux-appimage
          path: |
            alem-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7
